spring.application.name=desafio

# ==========================================================
# Server
# ==========================================================

server.port=8080

# ==========================================================
# PostgreSQL
# ==========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/desafio
spring.datasource.username=desafio
spring.datasource.password=desafio
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ==========================================================
# Flyway
# ==========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ==========================================================
# Actuator / Health Check
# ==========================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================================
# Swagger / OpenAPI
# ==========================================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================================
# JWT
# ==========================================================

jwt.secret=${JWT_SECRET:Docker-K8S-Debian#2027!Ganhar)Muito_$$$!!!Loester-Lindo-TKD@@}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ==========================================================
# Error Details
# ==========================================================

server.error.include-message=always
server.error.include-stacktrace=always

# ==========================================================
# Logging
# ==========================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=INFO
logging.level.org.springdoc=INFO